name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: viikko3-sovellus
        run: npm ci

      - name: Build React app
        working-directory: viikko3-sovellus
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site/viikko3-sovellus
          cp index.html styles.css viikko1.html viikko2.html _site/
          cp -r viikko3-sovellus/dist/* _site/viikko3-sovellus/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
